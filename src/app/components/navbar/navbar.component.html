<header class="fixed top-0 inset-x-0 z-50 bg-[#0a0a0a]/90 backdrop-blur-md border-b border-neutral-800/80 transition-colors">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <a routerLink="/" (click)="closeMobileNav()" class="flex items-center gap-3.5 group">
        <div class="relative w-11 h-11 rounded-xl overflow-hidden border border-neutral-700/60 bg-neutral-900 group-hover:border-orange-500/50 transition-all duration-300">
          <img src="assets/logo.png" alt="شعار عدسة" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
        </div>
        <div class="flex flex-col">
          <span class="text-xl font-bold tracking-tight text-white group-hover:text-orange-400 transition-colors">عَدَسَة</span>
          <span class="text-xs text-neutral-400 font-medium hidden sm:block">فنون التصوير الفوتوغرافي</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-1.5 bg-[#141416] p-1.5 rounded-full border border-neutral-800 shadow-inner">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm font-semibold"
          class="px-5 py-2 rounded-full text-sm font-medium text-neutral-300 hover:text-white transition-all duration-200"
        >
          الرئيسية
        </a>
        <a
          routerLink="/blog"
          routerLinkActive="bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm font-semibold"
          class="px-5 py-2 rounded-full text-sm font-medium text-neutral-300 hover:text-white transition-all duration-200"
        >
          المقالات
        </a>
        <a
          routerLink="/about"
          routerLinkActive="bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm font-semibold"
          class="px-5 py-2 rounded-full text-sm font-medium text-neutral-300 hover:text-white transition-all duration-200"
        >
          من نحن
        </a>
      </nav>

      <div class="hidden md:flex items-center gap-3">
        <a
          routerLink="/blog"
          class="custom-btn-primary"
        >
          <span>استكشف المدونة</span>
          <i class="fa-solid fa-arrow-left text-xs"></i>
        </a>
      </div>

      <button
        type="button"
        (click)="toggleMobileNav()"
        aria-label="تبديل القائمة"
        class="md:hidden inline-flex items-center justify-center p-2.5 rounded-xl border border-neutral-800 bg-neutral-900 text-neutral-300 hover:text-white hover:border-neutral-700 transition-colors"
      >
        <i [class]="mobileMenuVisible ? 'fa-solid fa-xmark text-lg' : 'fa-solid fa-bars text-lg'"></i>
      </button>

    </div>
  </div>

  @if (mobileMenuVisible) {
    <div class="md:hidden border-t border-neutral-800/80 bg-[#0e0e10]/95 backdrop-blur-xl px-4 pt-3 pb-5 transition-all">
      <div class="flex flex-col space-y-1">
        <a
          routerLink="/"
          (click)="closeMobileNav()"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-orange-500/15 text-orange-400 border border-orange-500/30"
          class="px-4 py-2.5 rounded-xl text-sm font-medium text-neutral-300 hover:text-white transition-colors"
        >
          الرئيسية
        </a>
        <a
          routerLink="/blog"
          (click)="closeMobileNav()"
          routerLinkActive="bg-orange-500/15 text-orange-400 border border-orange-500/30"
          class="px-4 py-2.5 rounded-xl text-sm font-medium text-neutral-300 hover:text-white transition-colors"
        >
          المقالات
        </a>
        <a
          routerLink="/about"
          (click)="closeMobileNav()"
          routerLinkActive="bg-orange-500/15 text-orange-400 border border-orange-500/30"
          class="px-4 py-2.5 rounded-xl text-sm font-medium text-neutral-300 hover:text-white transition-colors"
        >
          من نحن
        </a>
        <div class="pt-2">
          <a
            routerLink="/blog"
            (click)="closeMobileNav()"
            class="custom-btn-primary w-full text-center"
          >
            <span>استكشف المدونة</span>
          </a>
        </div>
      </div>
    </div>
  }
</header>
